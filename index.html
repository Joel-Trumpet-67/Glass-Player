<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glass">
<meta name="theme-color" content="#0b0b10">
<title>Glass Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b10;
  --text:#f5f5f7;
  --text-2:rgba(245,245,247,.62);
  --text-3:rgba(245,245,247,.38);
  --accent:#ff5f6d;
  --danger:#ff6961;
  --glass-tint:rgba(255,255,255,.08);
  --glass-tint-strong:rgba(255,255,255,.14);
  --glass-rim:rgba(255,255,255,.35);
  --glass-rim-low:rgba(255,255,255,.06);
  --glass-shadow:0 10px 40px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.2);
  --r-pill:999px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{-webkit-user-select:text;user-select:text}

/* ---------- CONTENT LAYER ---------- */
.ambient{position:fixed;inset:-20%;z-index:0;filter:blur(80px) saturate(140%);opacity:.55;transition:background 1.2s var(--ease)}
.app{position:relative;z-index:1;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 64px) 16px calc(var(--safe-b) + 170px)}
.app.no-mini{padding-bottom:calc(var(--safe-b) + 100px)}
.view{display:none;animation:fadeUp .45s var(--ease)}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 18px}
h2{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:26px 4px 12px}

.hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:1.6;display:flex;align-items:flex-end;justify-content:space-between;
  padding:18px;width:100%;text-align:left;gap:12px}
.hero > .art{position:absolute;inset:0}
.hero .meta{position:relative}
.hero small{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.hero h3{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.hero .go{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero .go svg{width:24px;height:24px}

.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tile{flex:0 0 148px;scroll-snap-align:start;text-align:left}
.tile .art{width:148px;height:148px;border-radius:18px;margin-bottom:8px;transition:transform .35s var(--spring)}
.tile:active .art{transform:scale(.95)}
.tile b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile i{display:block;font-style:normal;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{display:flex;flex-direction:column}
.track{display:flex;align-items:center;gap:4px;padding:6px 0 6px 4px;width:100%}
.track .hit{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:2px 0;transition:opacity .2s}
.track .hit:active{opacity:.6}
.track .art{width:52px;height:52px;border-radius:10px;flex:none}
.track .t{flex:1;min-width:0}
.track b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track i{display:block;font-style:normal;font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.playing b{color:var(--accent)}
.track.offline .hit{opacity:.4}
.track .dur{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.track .more{width:40px;height:44px;display:grid;place-items:center;color:var(--text-3);flex:none}
.track .more svg{width:20px;height:20px}

.artist-row{display:flex;align-items:center;gap:14px;padding:8px 4px;width:100%;text-align:left}
.artist-row .art{width:56px;height:56px;border-radius:50%;flex:none}
.artist-row b{font-size:17px;font-weight:500;display:block}
.artist-row i{font-style:normal;font-size:14px;color:var(--text-2)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:16px;font-weight:500;margin:0 0 6px 2px}
.back svg{width:20px;height:20px}

.search-field{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.08);margin-bottom:8px}
.search-field input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;min-width:0}
.search-field input::placeholder{color:var(--text-3)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 4px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:var(--text);color:#000}

.empty{text-align:center;padding:40px 18px;border-radius:28px;margin-top:8px}
.disc{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;background:conic-gradient(from 0deg,#3f5efb,#fc466b,#ffc371,#3f5efb);
  display:grid;place-items:center;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.disc::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--bg)}
.empty h3{font-size:22px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--text-2);font-size:15px;line-height:1.45;margin-bottom:20px}
.btn{height:50px;padding:0 24px;border-radius:var(--r-pill);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.solid{background:var(--text);color:#000}
.btn.ghost{background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.5}
.muted{color:var(--text-3);font-size:14px;text-align:center;padding:24px 0}

/* Album art */
.art{background:var(--g);background-size:cover;background-position:center;position:relative;overflow:hidden}
.art.gen::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 10%,rgba(255,255,255,.28),transparent 55%)}
.art .init{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:-.02em}

/* ---------- GLASS LAYER ---------- */
.glass{
  position:relative;background:var(--glass-tint);
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.05);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.05);
  box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-rim), inset 0 -1px 0 var(--glass-rim-low), inset 0 0 0 .5px rgba(255,255,255,.12);
  isolation:isolate;
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%),
    radial-gradient(140% 90% at 50% -20%,rgba(255,255,255,.18),transparent 60%);
  mix-blend-mode:screen;
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 40%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.press{transition:transform .45s var(--spring), background .25s}
.press:active{transform:scale(.94);background:var(--glass-tint-strong)}

.topbar{position:fixed;z-index:20;top:calc(var(--safe-t) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.topbar > *{pointer-events:auto}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.count{height:44px;padding:0 14px 0 6px;border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-2)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3f5efb,#fc466b);color:#fff;font-size:14px;font-weight:700}
.count.local{padding-left:14px}
.count.local .avatar{display:none}

.dock{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(var(--safe-b) + 10px);display:flex;flex-direction:column;gap:10px}
.mini{height:62px;border-radius:var(--r-pill);display:flex;align-items:center;gap:12px;padding:0 8px 0 9px;text-align:left;
  transition:transform .5s var(--spring), opacity .3s}
.mini[hidden]{display:none}
.mini .art{width:46px;height:46px;border-radius:50%;flex:none}
.mini.spin .art{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mini .t{flex:1;min-width:0}
.mini b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini i{display:block;font-style:normal;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ctl{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.mini .ctl svg{width:22px;height:22px}
.mini-progress{position:absolute;left:24px;right:24px;bottom:4px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.mini-progress div{height:100%;width:0;background:var(--text)}
.mini.loading .mini-progress div{width:30%!important;animation:load 1s ease-in-out infinite alternate}
@keyframes load{from{transform:translateX(-20%)}to{transform:translateX(260%)}}

.tabs{height:66px;border-radius:var(--r-pill);display:flex;padding:6px;position:relative}
.tab-pill{position:absolute;top:6px;bottom:6px;left:6px;border-radius:var(--r-pill);background:rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .55s var(--spring), width .55s var(--spring)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;
  color:var(--text-2);position:relative;z-index:1;transition:color .25s}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* ---------- NOW PLAYING ---------- */
.sheet{position:fixed;inset:0;z-index:50;transform:translateY(100%);transition:transform .6s var(--ease);
  display:flex;flex-direction:column;padding:calc(var(--safe-t) + 14px) 24px calc(var(--safe-b) + 24px);overflow:hidden;background:var(--bg)}
.sheet.open{transform:none}
.sheet .bgart{position:absolute;inset:-30%;z-index:-2;filter:blur(70px) saturate(160%);transform:scale(1.1);background:var(--g);background-size:cover;background-position:center}
.sheet .bgdim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.6))}
.grabber{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto 18px;cursor:pointer}
.np-art{width:100%;max-width:min(360px,42vh);aspect-ratio:1;margin:8px auto 26px;border-radius:24px;
  box-shadow:0 30px 60px rgba(0,0,0,.45);transition:transform .6s var(--spring)}
.sheet:not(.playing) .np-art{transform:scale(.86)}
.np-head{display:flex;align-items:center;gap:12px;max-width:360px;width:100%;margin:0 auto}
.np-head .t{flex:1;min-width:0}
.np-head b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-head i{display:block;font-style:normal;font-size:18px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.heart svg{width:20px;height:20px}
.heart.on svg{fill:var(--accent);stroke:var(--accent)}

.scrub{max-width:360px;width:100%;margin:22px auto 0;touch-action:none}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;transition:height .25s var(--spring)}
.scrub.drag .bar{height:12px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:rgba(255,255,255,.9)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-top:8px;font-variant-numeric:tabular-nums}

.controls{display:flex;justify-content:space-between;align-items:center;max-width:320px;width:100%;margin:20px auto 0}
.cbtn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.cbtn svg{width:30px;height:30px}
.cbtn.big{width:84px;height:84px}
.cbtn.big svg{width:38px;height:38px}

.np-foot{margin-top:auto;display:flex;justify-content:center;gap:10px;padding-top:20px}
.np-foot .glass{height:46px;padding:0 18px;border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.np-foot svg{width:18px;height:18px}
.np-foot .on{color:var(--accent)}

/* ---------- ACTION SHEET ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.action{position:fixed;z-index:80;left:10px;right:10px;bottom:calc(var(--safe-b) + 10px);border-radius:30px;padding:10px;
  transform:translateY(130%);transition:transform .5s var(--spring);max-width:500px;margin:0 auto}
.action.on{transform:none}
.action .head{display:flex;gap:12px;align-items:center;padding:8px 8px 14px}
.action .head .art{width:48px;height:48px;border-radius:10px;flex:none}
.action .head .t{min-width:0}
.action .head b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action .head i{font-style:normal;color:var(--text-2);font-size:14px}
.action .opt{display:flex;align-items:center;gap:14px;width:100%;height:52px;padding:0 14px;border-radius:18px;font-size:17px;text-align:left}
.action .opt:active{background:rgba(255,255,255,.08)}
.action .opt svg{width:22px;height:22px;flex:none}
.action .opt.danger{color:var(--danger)}
.action .note{font-size:13px;color:var(--text-3);padding:4px 14px 8px;line-height:1.4}
.action label{display:block;font-size:13px;color:var(--text-2);margin:6px 8px 6px}
.action input,.signin input{width:100%;height:48px;border-radius:14px;border:0;outline:0;padding:0 14px;font:inherit;font-size:17px;
  background:rgba(255,255,255,.1);color:var(--text)}
.action .btns{display:flex;gap:10px;margin-top:14px}
.action .btns .btn{flex:1}

/* ---------- SIGN IN ---------- */
.signin{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.signin[hidden]{display:none}
.signin::before{content:"";position:absolute;inset:-20%;background:radial-gradient(50% 40% at 20% 20%,#3f5efb,transparent),radial-gradient(50% 40% at 85% 70%,#fc466b,transparent);filter:blur(70px);opacity:.6}
.signin form{position:relative;width:100%;max-width:380px;border-radius:32px;padding:28px 20px 22px;display:flex;flex-direction:column;gap:12px}
.signin .disc{width:72px;height:72px;margin-bottom:6px}
.signin h2{text-align:center;margin:0 0 2px;font-size:26px}
.signin p{text-align:center;color:var(--text-2);font-size:15px;margin-bottom:6px}
.signin .err{color:var(--danger);font-size:14px;text-align:center;min-height:18px;margin:0}
.signin .btn{width:100%;margin-top:4px}

.toast{position:fixed;z-index:110;top:calc(var(--safe-t) + 64px);left:50%;transform:translate(-50%,-30px) scale(.9);opacity:0;pointer-events:none;
  padding:12px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:600;transition:transform .5s var(--spring),opacity .25s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0);opacity:1}

.dropzone{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(11,11,16,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dropzone.on{display:grid}
.dropzone div{padding:28px 36px;border-radius:30px;font-size:20px;font-weight:700}

svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor;stroke:none}
#file,#folder{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-transparency:reduce){
  .glass{background:rgba(40,40,48,.92);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.zip,application/zip,application/x-zip-compressed" multiple>
<input type="file" id="folder" webkitdirectory multiple>
<audio id="au" preload="auto" playsinline></audio>

<div class="topbar">
  <button class="glass count press local" id="count"><span class="avatar" id="avatar"></span><span id="countTxt">0 songs</span></button>
  <button class="glass icon-btn press" id="addBtn" aria-label="Add music">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<main class="app no-mini" id="app">
  <section class="view active" data-view="home">
    <h1>Listen</h1>
    <div id="homeBody"></div>
  </section>

  <section class="view" data-view="search">
    <h1>Search</h1>
    <div class="search-field">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px;color:var(--text-3);flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Songs or artists" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="chips" id="artistChips"></div>
    <div class="list" id="results" style="margin-top:12px"></div>
  </section>

  <section class="view" data-view="library">
    <h1>Library</h1>
    <div class="chips" id="libChips">
      <button class="chip on" data-lib="songs">Songs</button>
      <button class="chip" data-lib="artists">Artists</button>
      <button class="chip" data-lib="liked">Liked</button>
    </div>
    <div id="libBody" style="margin-top:12px"></div>
  </section>
</main>

<div class="dock">
  <div class="glass mini press" id="mini" role="button" hidden>
    <div class="art" id="miniArt"></div>
    <div class="t"><b id="miniTitle"></b><i id="miniArtist"></i></div>
    <button class="ctl" id="miniPlay" aria-label="Play or pause"></button>
    <button class="ctl" id="miniNext" aria-label="Next">
      <svg class="fill" viewBox="0 0 24 24"><path d="M5 5.5v13l9-6.5zM14 5.5v13l9-6.5z"/></svg>
    </button>
    <div class="mini-progress"><div id="miniFill"></div></div>
  </div>
  <nav class="glass tabs" id="tabs">
    <div class="tab-pill" id="pill"></div>
    <button class="tab on" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-tab="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
    <button class="tab" data-tab="library">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="18" rx="1.5"/><path d="m17.5 4 3.5 16"/></svg>Library</button>
  </nav>
</div>

<section class="sheet" id="sheet">
  <div class="bgart" id="npBg"></div>
  <div class="bgdim"></div>
  <div class="grabber" id="close"></div>
  <div class="np-art art" id="npArt"></div>
  <div class="np-head">
    <div class="t"><b id="npTitle"></b><i id="npArtist"></i></div>
    <button class="glass heart press" id="heart" aria-label="Like">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    </button>
  </div>

<script>
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => !isFinite(s) || s < 0 ? "0:00" : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const PALETTE = [["#ff5f6d","#ffc371"],["#6a11cb","#2575fc"],["#00c9a7","#0f4c75"],["#f857a6","#ff5858"],["#43cea2","#185a9d"],
  ["#f7971e","#ffd200"],["#8e2de2","#4a00e0"],["#11998e","#38ef7d"],["#fc466b","#3f5efb"],["#ee0979","#ff6a00"]];
const hash = s => { let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const uuid = () => crypto.randomUUID ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const ICON_PLAY = '<svg class="fill" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg class="fill" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
const ICON_MORE = '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>';
const ls = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
             del(k){ try { localStorage.removeItem(k); } catch {} } };

let toastT;
function toast(msg, ms = 2200){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); if (ms) toastT = setTimeout(() => t.classList.remove("on"), ms);
}

/* ================= cloud config ================= */
const CFG = window.GLASS_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase);
const sb = CLOUD ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey,
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }) : null;
const BUCKET = "music";
let user = null;

/* ================= device storage (IndexedDB) =================
   tracks: full songs for "this device only" mode
   cache:  downloaded audio + covers for cloud mode            */
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open("glass-player", 2);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains("tracks")) r.result.createObjectStore("tracks", { keyPath: "id" });
      if (!r.result.objectStoreNames.contains("cache")) r.result.createObjectStore("cache", { keyPath: "id" });
    };
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  }); },
  req(store, mode, fn){ return new Promise((res, rej) => {
    if (!this.db) return rej(new Error("no db"));
    const r = fn(this.db.transaction(store, mode).objectStore(store)); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }); },
  all(store){ return this.req(store, "readonly", s => s.getAll()); },
  get(store, id){ return this.req(store, "readonly", s => s.get(id)); },
  put(store, v){ return this.req(store, "readwrite", s => s.put(v)); },
  del(store, id){ return this.req(store, "readwrite", s => s.delete(id)); },
  clear(store){ return this.req(store, "readwrite", s => s.clear()); }
};
async function cachePatch(id, patch){
  const cur = (await DB.get("cache", id).catch(() => null)) || { id };
  await DB.put("cache", Object.assign(cur, patch)).catch(() => {});
}

/* ================= filename cleanup ================= */
const JUNK = /(official|video|audio|lyric|visuali[sz]er|\bhd\b|\b4k\b|remaster|music video|mv)/i;
function cleanName(filename){
  let s = filename.replace(/\.[a-z0-9]{2,4}$/i, "")
    .replace(/_/g, " ")
    .replace(/^@+/, "")
    .replace(/\s*[\(\[]([^\)\]]*)[\)\]]/g, (m, inner) => JUNK.test(inner) ? "" : m)
    .replace(/\s+(official\s+)?(music\s+)?(video|audio)\s*$/i, "")
    .replace(/\s+/g, " ").trim();
  const parts = s.split(/\s+-\s+/);
  const cap = x => x === x.toLowerCase() ? x.replace(/\b\w/g, c => c.toUpperCase()) : x;
  if (parts.length >= 2) return { artist: cap(parts[0].trim()), title: parts.slice(1).join(" - ").trim() };
  return { artist: "Unknown Artist", title: s };
}

/* ================= ID3 tag reader (v2.3 / v2.4) ================= */
async function readTags(file){
  const out = {};
  try {
    const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return out;
    const ver = head[3];
    const size = (head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
    const d = new Uint8Array(await file.slice(10, 10 + Math.min(size, 4e6)).arrayBuffer());
    const dec = (enc, bytes) => {
      const label = ["latin1","utf-16","utf-16be","utf-8"][enc] || "latin1";
      try { return new TextDecoder(label).decode(bytes).replace(/\0+$/,"").replace(/\0/g," ").trim(); } catch { return ""; }
    };
    let i = 0;
    if (head[5] & 0x40) i = ver === 4 ? ((d[0]<<21)|(d[1]<<14)|(d[2]<<7)|d[3]) : ((d[0]<<24)|(d[1]<<16)|(d[2]<<8)|d[3]) + 4;
    while (i + 10 < d.length){
      const id = String.fromCharCode(d[i],d[i+1],d[i+2],d[i+3]);
      if (!/^[A-Z0-9]{4}$/.test(id)) break;
      const sz = ver === 4 ? ((d[i+4]<<21)|(d[i+5]<<14)|(d[i+6]<<7)|d[i+7]) : ((d[i+4]<<24)|(d[i+5]<<16)|(d[i+6]<<8)|d[i+7]) >>> 0;
      if (!sz || i + 10 + sz > d.length) break;
      const body = d.subarray(i + 10, i + 10 + sz);
      if (id === "TIT2") out.title = dec(body[0], body.subarray(1));
      else if (id === "TPE1") out.artist = dec(body[0], body.subarray(1));
      else if (id === "TALB") out.album = dec(body[0], body.subarray(1));
      else if (id === "APIC" && !out.cover){
        const enc = body[0]; let p = 1;
        let mime = ""; while (p < body.length && body[p] !== 0) mime += String.fromCharCode(body[p++]);
        p += 2;
        if (enc === 1 || enc === 2){ while (p + 1 < body.length && !(body[p] === 0 && body[p+1] === 0)) p += 2; p += 2; }
        else { while (p < body.length && body[p] !== 0) p++; p++; }
        if (p < body.length) out.cover = new Blob([body.slice(p)], { type: mime && mime.includes("/") ? mime : "image/jpeg" });
      }
      i += 10 + sz;
    }
  } catch {}
  return out;
}
function getDuration(file){
  return new Promise(res => {
    const a = new Audio(); const url = URL.createObjectURL(file);
    let done = false; const fin = v => { if (done) return; done = true; URL.revokeObjectURL(url); res(v || 0); };
    a.preload = "metadata"; a.onloadedmetadata = () => fin(a.duration); a.onerror = () => fin(0);
    setTimeout(() => fin(0), 8000); a.src = url;
  });
}
async function coverColors(blob){
  try {
    const bmp = await createImageBitmap(blob);
    const c = document.createElement("canvas"); c.width = c.height = 4;
    const x = c.getContext("2d"); x.drawImage(bmp, 0, 0, 4, 4);
    const p = x.getImageData(0, 0, 4, 4).data;
    const px = i => `rgb(${p[i]},${p[i+1]},${p[i+2]})`;
    return [px(0), px(60)];
  } catch { return null; }
}

/* ================= state ================= */
let tracks = [];
const coverURL = new Map();
const signed = new Map();           // storage path -> signed URL
let signedAt = 0;
const state = {
  cur: null, order: [], pos: -1,
  shuffle: ls.get("gp.shuffle", false), repeat: ls.get("gp.repeat", "off"),
  recent: ls.get("gp.recent", []), libTab: "songs", artistFilter: null, online: navigator.onLine
};
const au = $("au");
const byId = id => tracks.find(t => t.id === id);
const playable = t => !!t.file || (CLOUD && state.online);

/* ================= library: one interface, two backends ================= */
const Lib = {
  async load(){
    if (!CLOUD){ tracks = await DB.all("tracks").catch(() => []); return; }
    let meta;
    try {
      const [tr, lk] = await Promise.all([
        sb.from("tracks").select("*").order("added_at"),
        sb.from("likes").select("track_id")
      ]);
      if (tr.error) throw tr.error;
      const liked = new Set((lk.data || []).map(r => r.track_id));
      meta = tr.data.map(r => ({
        id: r.id, title: r.title, artist: r.artist, album: r.album || "", dur: r.duration || 0,
        fileName: r.file_name, size: r.size, path: r.path, coverPath: r.cover_path,
        g: [r.color1 || PALETTE[hash(r.title) % 10][0], r.color2 || PALETTE[hash(r.title) % 10][1]],
        added: Date.parse(r.added_at), liked: liked.has(r.id)
      }));
      ls.set("gp.meta", meta);
      state.online = true;
    } catch (e) {
      meta = ls.get("gp.meta", []);
      state.online = false;
      if (meta.length) toast("Offline: showing songs saved on this device", 3000);
      else toast("Can't reach your library. Check your connection.", 4000);
    }
    const cache = new Map((await DB.all("cache").catch(() => [])).map(c => [c.id, c]));
    // drop downloads of songs that were removed from the library
    for (const id of cache.keys()) if (!meta.some(m => m.id === id)) DB.del("cache", id).catch(() => {});
    tracks = meta.map(m => ({ ...m, file: cache.get(m.id)?.file || null, cover: cache.get(m.id)?.cover || null }));
    if (state.online){ await refreshSigned(); fetchCovers(); }
  },
  async add(f, info){
    if (!CLOUD){
      const t = { ...info, file: f };
      await DB.put("tracks", t); return t;
    }
    const ext = (f.name.split(".").pop() || "mp3").toLowerCase();
    const path = `songs/${info.id}.${ext}`;
    const up = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || "audio/mpeg", upsert: false });
    if (up.error) throw up.error;
    let coverPath = null;
    if (info.cover){
      coverPath = `covers/${info.id}.${(info.cover.type.split("/")[1] || "jpg").replace("jpeg","jpg")}`;
      const c = await sb.storage.from(BUCKET).upload(coverPath, info.cover, { contentType: info.cover.type, upsert: true });
      if (c.error) coverPath = null;
    }
    const ins = await sb.from("tracks").insert({
      id: info.id, title: info.title, artist: info.artist, album: info.album, file_name: info.fileName,
      size: info.size, duration: info.dur, path, cover_path: coverPath, color1: info.g[0], color2: info.g[1]
    });
    if (ins.error){ await sb.storage.from(BUCKET).remove([path, coverPath].filter(Boolean)); throw ins.error; }
    const t = { ...info, path, coverPath, file: f };
    await cachePatch(t.id, { file: f, cover: info.cover || null });
    return t;
  },
  async update(t){
    if (!CLOUD) return DB.put("tracks", t);
    const r = await sb.from("tracks").update({ title: t.title, artist: t.artist, duration: t.dur }).eq("id", t.id);
    if (r.error) throw r.error;
    ls.set("gp.meta", tracks.map(stripBlobs));
  },
  async remove(t){
    if (!CLOUD) return DB.del("tracks", t.id);
    const r = await sb.from("tracks").delete().eq("id", t.id);
    if (r.error) throw r.error;
    await sb.storage.from(BUCKET).remove([t.path, t.coverPath].filter(Boolean));
    await DB.del("cache", t.id).catch(() => {});
  },
  async like(t, v){
    if (!CLOUD) return DB.put("tracks", t);
    const r = v ? await sb.from("likes").upsert({ track_id: t.id }) : await sb.from("likes").delete().eq("track_id", t.id);
    if (r.error) throw r.error;
    ls.set("gp.meta", tracks.map(stripBlobs));
  }
};
const stripBlobs = ({ file, cover, ...m }) => m;

async function refreshSigned(force){
  if (!CLOUD || !state.online) return;
  if (!force && Date.now() - signedAt < 20 * 3600e3 && tracks.every(t => signed.has(t.path))) return;
  const paths = tracks.map(t => t.path).filter(Boolean);
  if (!paths.length) return;
  const r = await sb.storage.from(BUCKET).createSignedUrls(paths, 24 * 3600);
  if (r.error) return;
  r.data.forEach(x => { if (x.signedUrl) signed.set(x.path, x.signedUrl); });
  signedAt = Date.now();
}
async function fetchCovers(){
  const need = tracks.filter(t => t.coverPath && !t.cover);
  let n = 0;
  for (const t of need){
    const r = await sb.storage.from(BUCKET).download(t.coverPath);
    if (r.data){ t.cover = r.data; await cachePatch(t.id, { cover: r.data }); }
    if (++n % 8 === 0) renderAll();
  }
  if (need.length) renderAll();
}
const downloading = new Map();
function download(t){
  if (t.file) return Promise.resolve(t.file);
  if (downloading.has(t.id)) return downloading.get(t.id);
  const p = (async () => {
    const r = await sb.storage.from(BUCKET).download(t.path);
    if (r.error) throw r.error;
    t.file = r.data; await cachePatch(t.id, { file: r.data });
    return r.data;
  })().finally(() => downloading.delete(t.id));
  downloading.set(t.id, p);
  return p;
}

/* ================= art ================= */
function artStyle(t){
  if (t.cover){
    if (!coverURL.has(t.id)) coverURL.set(t.id, URL.createObjectURL(t.cover));
    return `--g:url('${coverURL.get(t.id)}') center/cover`;
  }
  return `--g:linear-gradient(135deg,${t.g[0]},${t.g[1]})`;
}
function artHTML(t, size = 20){
  const init = t.cover ? "" : `<span class="init" style="font-size:${size}px">${esc((t.title[0] || "♪").toUpperCase())}</span>`;
  return `<div class="art ${t.cover ? "" : "gen"}" style="${artStyle(t)}">${init}</div>`;
}
function setArt(el, t, size){
  el.classList.toggle("gen", !t.cover);
  el.setAttribute("style", artStyle(t));
  el.innerHTML = t.cover ? "" : `<span class="init" style="font-size:${size}px">${esc((t.title[0] || "♪").toUpperCase())}</span>`;
}

/* ================= sheets ================= */
function openSheet(html){ const a = $("action"); a.innerHTML = html; a.classList.add("on"); $("scrim").classList.add("on"); return a; }
function closeActions(){ $("action").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = closeActions;

/* ================= import / upload ================= */
const AUDIO_RE = /\.(mp3|m4a|aac|wav|flac)$/i;
const isZip = f => /\.zip$/i.test(f.name) || /zip/.test(f.type);
const canPickFolder = "webkitdirectory" in document.createElement("input") && !/iPhone|iPad|iPod/.test(navigator.userAgent);
const MIME = { mp3: "audio/mpeg", m4a: "audio/mp4", aac: "audio/aac", wav: "audio/wav", flac: "audio/flac" };

function openAddSheet(){
  const where = CLOUD ? "Uploads to your library, so it shows up on all your devices" : "Songs stay on this device";
  const a = openSheet(`<div class="head"><div class="t"><b>Add music</b><i>${where}</i></div></div>
    <button class="opt" id="addFiles"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Choose songs or a .zip</button>
    ${canPickFolder ? `<button class="opt" id="addFolder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Choose a whole folder</button>` : ""}
    <p class="note">${canPickFolder
      ? "You can also drag a folder onto this window."
      : "To add a whole folder at once: on your Mac, right-click the folder → Compress, AirDrop the .zip to Files, then pick it here."}</p>`);
  $("addFiles").onclick = () => { closeActions(); $("file").click(); };
  if (canPickFolder) $("addFolder").onclick = () => { closeActions(); $("folder").click(); };
}
$("addBtn").onclick = () => {
  if (CLOUD && !state.online){ toast("You're offline. Connect to add songs."); return; }
  openAddSheet();
};
$("file").onchange = e => { const f = [...e.target.files]; e.target.value = ""; importFiles(f); };
$("folder").onchange = e => { const f = [...e.target.files]; e.target.value = ""; importFiles(f); };

let dragDepth = 0;
addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")){ dragDepth++; $("drop").classList.add("on"); } });
addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; $("drop").classList.remove("on"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; $("drop").classList.remove("on");
  if (CLOUD && !user) return;
  const items = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!items.length){ importFiles([...e.dataTransfer.files]); return; }
  const out = [];
  const walk = entry => new Promise(res => {
    if (entry.isFile) entry.file(f => { out.push(f); res(); }, () => res());
    else if (entry.isDirectory){
      const r = entry.createReader(); const batch = [];
      const read = () => r.readEntries(async ents => {
        if (!ents.length){ await Promise.all(batch.map(walk)); res(); }
        else { batch.push(...ents); read(); }
      }, () => res());
      read();
    } else res();
  });
  toast("Reading folder…", 0);
  await Promise.all(items.map(walk));
  importFiles(out);
});

function whenZipReady(){
  return new Promise((res, rej) => {
    if (window.JSZip) return res(window.JSZip);
    let n = 0; const t = setInterval(() => {
      if (window.JSZip){ clearInterval(t); res(window.JSZip); }
      else if (++n > 50){ clearInterval(t); rej(new Error("zip")); }
    }, 100);
  });
}

let importing = false;
const isDup = (name, size) => tracks.some(t => t.fileName === name && (!size || t.size === size));
async function importFiles(files){
  if (!files.length) return;
  if (importing){ toast("Still adding songs, hang on…"); return; }
  importing = true;
  try { await navigator.storage?.persist?.(); } catch {}
  const audio = files.filter(f => AUDIO_RE.test(f.name) || (f.type.startsWith("audio/") && !isZip(f)));
  const zips = files.filter(isZip);
  const total = { added: 0, skipped: 0, stop: null };

  if (audio.length) await importAudio(audio, total, true);

  for (const z of zips){
    if (total.stop) break;
    toast(`Opening ${z.name}…`, 0);
    try {
      const JSZip = await whenZipReady();
      const zip = await JSZip.loadAsync(z);
      const entries = Object.values(zip.files).filter(en => !en.dir && AUDIO_RE.test(en.name) && !/(^|\/)(__MACOSX|\.)/.test(en.name));
      if (!entries.length){ toast(`No songs found in ${z.name}`); continue; }
      for (let n = 0; n < entries.length && !total.stop; n++){
        const en = entries[n]; const name = en.name.split("/").pop();
        toast(`${CLOUD ? "Uploading" : "Adding"} ${n + 1} of ${entries.length}…`, 0);
        if (isDup(name, en._data?.uncompressedSize)){ total.skipped++; continue; }
        const blob = await en.async("blob");
        const ext = name.split(".").pop().toLowerCase();
        await importAudio([new File([blob], name, { type: MIME[ext] || "audio/mpeg" })], total, false);
      }
    } catch { total.stop = `Couldn't open ${z.name}. Make sure it's a normal .zip.`; }
  }

  importing = false;
  renderAll();
  if (total.stop) toast(total.stop, 5000);
  else toast(total.added || total.skipped
    ? `Added ${total.added} song${total.added === 1 ? "" : "s"}${total.skipped ? ` · ${total.skipped} already in library` : ""}`
    : "No songs found. Pick .mp3 or .m4a files, or a .zip of them.", 3000);
}
async function importAudio(files, total, showProgress){
  for (let n = 0; n < files.length && !total.stop; n++){
    const f = files[n];
    if (showProgress) toast(`${CLOUD ? "Uploading" : "Adding"} ${n + 1} of ${files.length}…`, 0);
    if (isDup(f.name, f.size)){ total.skipped++; continue; }
    if (CLOUD && f.size > 50 * 1024 * 1024){ total.skipped++; continue; }
    const tags = await readTags(f);
    const guess = cleanName(f.name);
    const title = tags.title && !JUNK.test(tags.title) ? tags.title : guess.title;
    const artist = tags.artist || guess.artist;
    const g = (tags.cover && await coverColors(tags.cover)) || PALETTE[hash(artist + title) % PALETTE.length];
    const info = {
      id: uuid(), title, artist, album: tags.album || "", fileName: f.name, size: f.size,
      dur: await getDuration(f), cover: tags.cover || null, g, liked: false, added: Date.now() + total.added
    };
    try {
      const t = await Lib.add(f, info);
      tracks.push(t); total.added++;
      if (total.added % 10 === 0) renderAll();
    } catch (e) {
      const msg = String(e?.message || e);
      total.stop = /quota|exceed|storage limit|payload/i.test(msg) ? "Your cloud storage is full."
        : /QuotaExceeded/i.test(e?.name) ? "This device is out of space for more songs."
        : `Upload stopped: ${msg}`;
    }
  }
  if (CLOUD) ls.set("gp.meta", tracks.map(stripBlobs));
}

/* ================= playback ================= */
let fileURL = null, loadToken = 0;
function buildOrder(ids, startId){
  let order = [...ids];
  if (state.shuffle){
    for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    if (startId){ order = order.filter(x => x !== startId); order.unshift(startId); }
  }
  return order;
}
function playFrom(ids, startId){
  const t0 = startId && byId(startId);
  if (t0 && !playable(t0)){ toast("This song isn't saved on this device. Connect to play it."); return; }
  if (!ids.length) return;
  state.order = buildOrder(ids, startId);
  state.pos = startId ? Math.max(0, state.order.indexOf(startId)) : 0;
  load(state.order[state.pos], true);
}
function load(id, autoplay){
  const t = byId(id); if (!t) return;
  state.cur = t; const token = ++loadToken;
  if (fileURL){ URL.revokeObjectURL(fileURL); fileURL = null; }

  // Set the source right away (inside the tap) so iPhone allows playback.
  if (t.file){ fileURL = URL.createObjectURL(t.file); au.src = fileURL; }
  else if (CLOUD && signed.has(t.path)){ au.src = signed.get(t.path); }
  else if (CLOUD && state.online){
    au.removeAttribute("src"); au.load();
    $("mini").classList.add("loading");
    refreshSigned(true).then(() => {
      if (token !== loadToken) return;
      if (signed.has(t.path)){ au.src = signed.get(t.path); if (autoplay) au.play().catch(() => toast("Tap play to start")); }
      else toast("Couldn't load this song.");
    });
  } else { au.removeAttribute("src"); au.load(); toast("This song isn't saved on this device."); }
  if (au.getAttribute("src") && autoplay) au.play().catch(() => {});

  setArt($("miniArt"), t, 18); setArt($("npArt"), t, 72);
  $("npBg").setAttribute("style", artStyle(t));
  $("ambient").style.background = `radial-gradient(60% 50% at 20% 10%,${t.g[0]},transparent),radial-gradient(60% 50% at 90% 40%,${t.g[1]},transparent)`;
  $("miniTitle").textContent = $("npTitle").textContent = t.title;
  $("miniArtist").textContent = $("npArtist").textContent = t.artist;
  $("heart").classList.toggle("on", !!t.liked);
  $("mini").hidden = false; $("app").classList.remove("no-mini");
  state.recent = [t.id, ...state.recent.filter(x => x !== t.id)].slice(0, 20); ls.set("gp.recent", state.recent);
  ls.set("gp.last", { order: state.order, pos: state.pos });
  markPlaying(); setMediaSession(t);
}
function next(dir = 1, auto = false){
  if (!state.order.length) return;
  if (dir < 0 && au.currentTime > 3){ au.currentTime = 0; return; }
  let p = state.pos;
  for (let tries = 0; tries < state.order.length; tries++){
    p += dir;
    if (p >= state.order.length){ if (auto && state.repeat === "off"){ au.pause(); au.currentTime = 0; return; } p = 0; }
    if (p < 0) p = state.order.length - 1;
    const t = byId(state.order[p]);
    if (t && playable(t)) break;          // skip songs that can't play offline
  }
  state.pos = p; load(state.order[p], true);
}
function toggle(){ if (!state.cur) return; au.paused ? au.play().catch(() => {}) : au.pause(); }
function syncPlayIcon(){
  const on = !au.paused;
  $("play").innerHTML = $("miniPlay").innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  $("sheet").classList.toggle("playing", on); $("mini").classList.toggle("spin", on);
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = on ? "playing" : "paused";
}
au.addEventListener("play", syncPlayIcon);

});

au.addEventListener("ended", () => { if (state.repeat === "one"){ au.currentTime = 0; au.play(); } else next(1, true); });
au.addEventListener("error", () => {

});

let dragging = false;

const scrub = $("scrub"), bar = $("bar");
function seekPreview(x){

  $("fill").style.width = f * 100 + "%"; $("cur").textContent = fmt(f * d); $("rem").textContent = "-" + fmt(d - f * d);

}

function setMediaSession(t){

}

function openActions(t){

async function doAction(what, t){
  if (what === "next"){
    if (!playable(t)){ toast("This song isn't saved on this device."); closeActions(); return; }
    if (!state.cur) playFrom([t.id], t.id);
    else { state.order = state.order.filter(x => x !== t.id); state.pos = state.order.indexOf(state.cur.id); state.order.splice(state.pos + 1, 0, t.id); toast(`"${t.title}" plays next`); }
    closeActions();
  } else if (what === "like"){
    closeActions(); await setLiked(t, !t.liked);
  } else if (what === "save"){
    closeActions(); toast("Saving…", 0);
    try { await download(t); toast("Saved to this device"); renderAll(); } catch { toast("Couldn't save it. Check your connection."); }
  } else if (what === "edit"){
    openSheet(`<div class="head">${artHTML(t)}<div class="t"><b>Edit song</b><i>${esc(t.fileName || "")}</i></div></div>
      <label for="edTitle">Title</label><input id="edTitle" value="${esc(t.title)}">
      <label for="edArtist">Artist</label><input id="edArtist" value="${esc(t.artist)}">
      <div class="btns"><button class="btn ghost" id="edSwap">Swap</button><button class="btn ghost" id="edCancel">Cancel</button><button class="btn solid" id="edSave">Save</button></div>`);
    $("edSwap").onclick = () => { const x = $("edTitle").value; $("edTitle").value = $("edArtist").value; $("edArtist").value = x; };

      try { await Lib.update(t); toast("Saved"); }

      closeActions(); renderAll();
      if (state.cur?.id === t.id){ $("miniTitle").textContent = $("npTitle").textContent = t.title; $("miniArtist").textContent = $("npArtist").textContent = t.artist; setMediaSession(t); }
    };
  } else if (what === "del"){
    openSheet(`<div class="head">${artHTML(t)}<div class="t"><b>Remove "${esc(t.title)}"?</b><i>${CLOUD ? "It's removed from your library on every device." : "It's removed from this app, not from Files."}</i></div></div>
      <div class="btns"><button class="btn ghost" id="dCancel">Cancel</button><button class="btn solid" id="dOk" style="background:var(--danger);color:#fff">Remove</button></div>`);

    };

}

async function downloadAll(){

  try { await navigator.storage?.persist?.(); } catch {}

  $("siBtn").disabled = true; $("siBtn").textContent = "Signing in…"; $("siErr").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  $("siBtn").disabled = false; $("siBtn").textContent = "Sign in";
  if (error){
    $("siErr").textContent = /invalid/i.test(error.message) ? "Wrong email or password." : navigator.onLine ? error.message : "You're offline. Connect to sign in.";
    return;
  }
  user = data.user; $("signin").hidden = true;
  await startLibrary();
};

/* ================= tabs ================= */
const tabs = [...document.querySelectorAll(".tab")];
function movePill(btn){
  const pill = $("pill"), nav = $("tabs").getBoundingClientRect(), r = btn.getBoundingClientRect();
  pill.style.width = r.width + "px"; pill.style.transform = `translateX(${r.left - nav.left - 6}px)`;
}
tabs.forEach(b => b.onclick = () => {
  tabs.forEach(x => x.classList.toggle("on", x === b)); movePill(b);
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.dataset.view === b.dataset.tab));
  $("app").scrollTo({ top: 0 });
});
addEventListener("resize", () => movePill(document.querySelector(".tab.on")));

/* ================= boot ================= */
let lastLoad = 0;
async function startLibrary(){
  if (CLOUD){
    $("count").classList.remove("local");
    $("avatar").textContent = (user?.email || "?")[0].toUpperCase();
  }
  await Lib.load(); lastLoad = Date.now();
  renderAll();
  const last = ls.get("gp.last", null);
  if (last && last.order?.length && !state.cur){
    state.order = last.order.filter(id => byId(id));
    state.pos = Math.min(Math.max(0, last.pos), state.order.length - 1);
    if (state.order.length) load(state.order[state.pos], false);
  }
}
// pick up songs added on your other devices when you come back to the app
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || !CLOUD || !user || importing || Date.now() - lastLoad < 60e3) return;
  lastLoad = Date.now(); await Lib.load(); renderAll();
});
addEventListener("online", () => { state.online = true; if (CLOUD && user){ Lib.load().then(renderAll); } else renderAll(); });
addEventListener("offline", () => { state.online = false; renderAll(); });

(async function boot(){
  $("shuf").classList.toggle("on", state.shuffle); paintRepeat(); syncPlayIcon();
  requestAnimationFrame(() => movePill(tabs[0]));
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  try { await DB.open(); } catch { toast("Storage is blocked here, so songs won't be saved.", 4000); }
  if (CLOUD){
    const { data } = await sb.auth.getSession();
    user = data?.session?.user || null;
    if (!user){ $("signin").hidden = false; return; }
  }
  await startLibrary();
})();
</script>
